car:
  inertia:
    m:        223   # Weight of the Vehicle [kg]
    m_driver: 0.0     # Weight of the driver  [kg]
    g:        9.81    # Graviti force         [m/s^2]
    I_z:      199.2    # Inertial force I_zz 

  kinematics:
    l: 1.59           # wheel base [m]
    b_F: 1.22          # Front axle width [m]
    b_R: 1.2         # Rear axle width [m]
    w_front: 0.5    # Percentage of weight front
    h_cg: 0.35       # Heights of COG [m]

    # l_F = l * (1 - w_front);  # Front cg lever arm [m]
    # l_R = l * w_front;  # Rear  cg lever arm [m]

  # Magic Formula:
  # y=D*sin(C*atan(B*(1-E)*x+E*atan(B*x)))
  tire:
    tire_coefficient: 1.0
    B: 12.56
    C: -1.38
    D: 1.60
    E: -0.58

  aero:
    C_Down: # F_Downforce = C_Downforce*v_x^2; C_Downforce = a*b*c
      a: 1.22
      b: 2.6
      c: 0.6
    C_drag: # F_Drag = C_Drag*v_x^2; C_drag = a*b*c
      a: 0.85
      b: 1.0
      c: 1.0

  drivetrain:
    Cm1: 2145
    Cr0: 44.6
    inertia: 0.4 # wheel_plus_packaging
    r_dyn: 0.231
    nm_wheels: 4
    
  torque_vectoring:
    K_FFW: 2.1
    K_p: 500 
    shrinkage: 0.8
    K_stability: 0.004
